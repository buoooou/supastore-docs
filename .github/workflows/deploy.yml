name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main  # 仅在推送到 main 分支时触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 1: 登录到 GitHub Container Registry (ghcr.io)
      # 这一步保持不变，因为我们仍然需要推送镜像的权限
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: buoooou
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===============================================================
      #  核心修改：使用 Nixpacks 替代 Dockerfile
      # ===============================================================

      # 步骤 2: 安装并设置 Nixpacks
      - name: Build and push with Nixpacks
        uses: iloveitaly/github-action-nixpacks@main # 使用这个有效的 Action
        with:
          # 告诉 Action 我们要推送镜像
          push: true
          # 定义镜像的标签
          tags: |
            ghcr.io/buoooou/supastore-docs:latest
            ghcr.io/buoooou/supastore-docs:${{ github.sha }}
      
      # ===============================================================

      - name: Trigger Dokploy Redeploy
        run: curl -X POST ${{ secrets.DOKPLOY_WEBHOOK_URL }}